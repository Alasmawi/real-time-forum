<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="/css/styles.css">
     <link rel="stylesheet" href="/css/layout-structure.css">
    <title>Real-time Forum</title>
</head>

<body>
    <div class="app-layout">
        <!-- Left Column -->
        <div class="left-column">
            <!-- User Profile Card (Top) -->
            <div id="user-profile-card" class="user-profile-card" style="display: none;">
                <!-- User profile content will be populated by app-init -->
            </div>

            <!-- Navigation Card (Bottom) -->
            <div id="nav-card" class="nav-card" style="display: none;">
                <!-- Navigation content will be populated by posts.js -->
            </div>
        </div>

        <!-- Middle Column -->
        <div class="middle-column">
            <!-- Categories Card will be injected here by posts controller -->
            
            <!-- Main Content Card -->
            <div id="content-card" class="content-card">
                <div id="content">
                    <!-- Content is loaded here dynamically -->
                </div>
            </div>
        </div>

        <!-- User List Card (Right) -->
        <div id="user-list" class="user-list" style="display: none;">
            <!-- User list content will be populated by posts.js -->
        </div>
    </div>

    <noscript>
        <div class="no-js-fallback">
            <h1>JavaScript Required</h1>
            <p>This Real-time Forum application requires JavaScript to function properly.</p>
            <p>Please enable JavaScript in your browser and refresh the page to access:</p>
            <ul>
                <li>User authentication and login</li>
                <li>Forum posts and discussions</li>
                <li>Real-time chat functionality</li>
                <li>Dynamic content loading</li>
            </ul>
            <h3>How to enable JavaScript:</h3>
            <p><strong>Chrome/Edge:</strong> Settings > Privacy and Security > Site Settings > JavaScript > Allowed</p>
            <p><strong>Firefox:</strong> Settings > Privacy & Security > Permissions > Enable JavaScript</p>
            <p><strong>Safari:</strong> Preferences > Security > Enable JavaScript</p>
        </div>
    </noscript>

    <script type="module" src="/js/modules/utils/UI-UX/theme-toggle.js"></script>
    <script type="module" src="/js/modules/utils/UI-UX/avatar-generator.js"></script>
    <script type="module" src="/js/modules/router.js"></script>
</body>

</html>
