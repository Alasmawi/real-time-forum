<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="/css/styles.css">
    <title>Real-time Forum</title>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="/" class="nav-link" data-link>Login</a></li>
                <li><a href="/register" class="nav-link" data-link>Register</a></li>
                <li><a href="/chat" class="nav-link" data-link>Chat</a></li>
                <li><a href="/posts" class="nav-link" data-link>Posts</a></li>
                <li><a href="/newpost" class="nav-link" data-link>New Post</a></li>
                <li><a href="/logout" class="nav-link" data-link>Logout</a></li>
            </ul>
        </nav>
    </header>

    <div id="content">
        <!-- Content is loaded here dynamically -->
    </div>

    <div id="user-list">
        <!-- Content is loaded here dynamically -->
    </div>

    <noscript>
        <div class="no-js-fallback">
            <h1>JavaScript Required</h1>
            <p>This Real-time Forum application requires JavaScript to function properly.</p>
            <p>Please enable JavaScript in your browser and refresh the page to access:</p>
            <ul>
                <li>User authentication and login</li>
                <li>Forum posts and discussions</li>
                <li>Real-time chat functionality</li>
                <li>Dynamic content loading</li>
            </ul>
            <h3>How to enable JavaScript:</h3>
            <p><strong>Chrome/Edge:</strong> Settings > Privacy and Security > Site Settings > JavaScript > Allowed</p>
            <p><strong>Firefox:</strong> Settings > Privacy & Security > Permissions > Enable JavaScript</p>
            <p><strong>Safari:</strong> Preferences > Security > Enable JavaScript</p>
        </div>
    </noscript>

    <script type="module" src="/js/modules/router.js"></script>
</body>

</html>
